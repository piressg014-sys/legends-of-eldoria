name: Build Legends of Eldoria Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install all Android SDK components required by Godot 4.3
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME and ANDROID_SDK_ROOT are both empty."
            exit 1
          fi
          echo "Using Android SDK: $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          sdkmanager --sdk_root="$SDK" --install \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"
          test -d "$SDK/cmdline-tools/latest" \
            && test -d "$SDK/platform-tools" \
            && test -d "$SDK/platforms/android-34" \
            && test -d "$SDK/build-tools/34.0.0" \
            && test -d "$SDK/ndk/23.2.8568313" \
            && test -d "$SDK/cmake/3.10.2.4988404"
          test -x "$SDK/platform-tools/adb"
          echo "All required Android SDK components are present."

      - name: Find and extract the Godot project
        shell: bash
        run: |
          mkdir -p extracted
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP" || { echo "No project ZIP found in repository root."; exit 1; }
          unzip -q "$ZIP" -d extracted
          PROJECT="$(find extracted -type f -name project.godot -printf '%h\n' | head -n 1)"
          test -n "$PROJECT" || { echo "project.godot was not found inside the ZIP."; exit 1; }
          test -f "$PROJECT/export_presets.cfg" || { echo "export_presets.cfg is missing."; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Godot project found at: $PROJECT"

      - name: Download Godot 4.3 and Android export templates
        shell: bash
        run: |
          mkdir -p "$HOME/godot" "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O "$HOME/godot/godot.zip"
          unzip -q "$HOME/godot/godot.zip" -d "$HOME/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O "$HOME/godot/templates.tpz"
          mkdir -p "$HOME/godot/templates"
          unzip -q "$HOME/godot/templates.tpz" -d "$HOME/godot/templates"
          cp -a "$HOME/godot/templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          chmod +x "$HOME/godot/Godot_v4.3-stable_linux.x86_64"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          EOF
          test -x "$JAVA_HOME/bin/java"
          test -x "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}/platform-tools/adb"

      - name: Create temporary debug signing key
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-signing"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/android-signing/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

      - name: Import Godot project
        shell: bash
        run: |
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" \
            --headless --editor --path "$PROJECT_DIR" --import --quit

      - name: Export debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/android-signing/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$PROJECT_DIR/build"
          "$HOME/godot/Godot_v4.3-stable_linux.x86_64" \
            --headless --verbose --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$PROJECT_DIR/build/LegendsOfEldoria.apk"
          test -s "$PROJECT_DIR/build/LegendsOfEldoria.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Legends-of-Eldoria-Android-APK
          path: extracted/**/build/LegendsOfEldoria.apk
          if-no-files-found: error
          retention-days: 14
